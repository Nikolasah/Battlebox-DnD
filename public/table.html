<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table screen · BattleBox</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="offline" id="offline" hidden>Connection lost. Reconnecting…</div>
<div class="table">
  <header class="table-top">
    <div class="row" style="gap:1.2vw">
      <h1 id="name"></h1>
      <span class="roundpill" id="round" hidden></span>
    </div>
    <div class="joinbox">
      <span class="muted">Join at <span id="host" style="color:var(--text)"></span></span>
      <b id="code"></b>
    </div>
  </header>
  <div class="table-main" id="main">
    <aside class="order" id="order" aria-label="Turn order"></aside>
    <section class="stage">
      <div class="spot" id="spot"></div>
      <div class="tray" id="tray" aria-live="polite"></div>
      <div class="feed" id="feed"></div>
    </section>
  </div>
</div>
<script type="module" src="/js/table.js"></script>
</body>
</html>
